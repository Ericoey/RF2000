; Default for the current hardware test: Y-only firmware with original LCD/keypad.
; GRBL owns main(), the interrupt vectors and all runtime initialization.
[platformio]
default_envs = rf2000_y_homing_test
src_dir = grbl
include_dir = grbl

[env:rf2000_grbl]
platform = platformio/atmelavr@5.1.0
platform_packages =
    platformio/toolchain-atmelavr@1.70300.191015
board = megaatmega2560
board_build.f_cpu = 16000000L
; No Arduino framework: the RF2000 firmware supplies its own bare-metal main.
build_src_filter =
    -<*>
    +<*.c>
    -<examples/>
build_flags =
    -std=gnu99
    -Os
    -Wall
    -Wextra
    -flto
    -ffunction-sections
    -fdata-sections
extra_scripts = post:tools/platformio-build.py
monitor_speed = 115200
monitor_eol = LF
monitor_echo = yes

; Default Y-only bench profile. Select rf2000_grbl explicitly for gated XYZ tests.
[env:rf2000_y_homing_test]
extends = env:rf2000_grbl
build_flags =
    ${env:rf2000_grbl.build_flags}
    -DRF2000_Y_HOMING_TEST=1
